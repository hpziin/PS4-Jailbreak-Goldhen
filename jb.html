
<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.appcache">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d18">

    <title>PS4// Jailbreak // Goldhen</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(ellipse at top, #142c50, transparent 55%),
                linear-gradient(135deg, #050914, #0b1425);
            color: #eaf4ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #wrap {
            width: 100%;
            max-width: 650px;
            padding: 40px 25px;
            border: 1px solid #1d5b91;
            border-radius: 18px;
            background: rgba(7, 17, 33, .94);
            box-shadow: 0 0 35px #0066aa33;
        }

        .brand {
            font-size: clamp(21px, 5vw, 29px);
            font-weight: bold;
            letter-spacing: 2px;
            color: #42baff;
            text-shadow: 0 0 18px #008cff;
        }

        .subtitle {
            margin-top: 12px;
            color: #8daac7;
            font-size: 12px;
            letter-spacing: 4px;
        }

        #spin {
            width: 65px;
            height: 65px;
            margin: 35px auto 25px;
            border: 5px solid #193b59;
            border-top-color: #31baff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #msg {
            min-height: 25px;
            margin: 20px 0;
            color: #d9edff;
            font-size: 17px;
        }

        #state {
            margin-top: 15px;
            color: #43c5ff;
            font-size: 13px;
            letter-spacing: 2px;
        }

        #out {
            margin-top: 25px;
            padding: 15px;
            background: #050b14;
            border: 1px solid #183957;
            border-radius: 8px;
            color: #9cc9e9;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        body.done #spin,
        body.fail #spin {
            display: none;
        }

        body.done #state {
            color: #42e69b;
        }

        body.fail #state {
            color: #ff5365;
        }

        body.log #out {
            display: block;
        }

        body:not(.log) #out {
            display: none;
        }

        .footer {
            margin-top: 30px;
            color: #54718c;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <main id="wrap">

        <div class="brand">
            PS4// Jailbreak // Goldhen
        </div>

        <div class="subtitle">
            INDEPENDENT EXPLOIT HOST
        </div>

        <div id="spin"></div>

        <div id="msg">
            Inicializando sistema...
        </div>

        <div id="state">
            INICIANDO
        </div>

        <pre id="out"></pre>

        <div class="footer">
            PS4 JAILBREAK PROJECT
            <br><br>
            GOLDHEN INTERFACE
        </div>

    </main>

    <!-- Monitoramento do processo -->
    <script>
        (() => {
            let encerrado = false;

            const body = document.body;

            const observador = new MutationObserver(() => {
                const sucesso = body.classList.contains("done");
                const falha = body.classList.contains("fail");

                if (!sucesso && !falha) return;

                observador.disconnect();

                if (encerrado) return;
                encerrado = true;

                const msg = document.getElementById("msg");
                const state = document.getElementById("state");

                if (sucesso) {
                    msg.textContent = "Processo concluído!";
                    state.textContent = "FINALIZADO";
                } else {
                    msg.textContent = "O processo terminou com falha.";
                    state.textContent = "FALHA";
                }

                setTimeout(() => {
                    window.close();

                    msg.textContent +=
                        " Se a página continuar aberta, feche manualmente.";
                }, 2500);
            });

            observador.observe(body, {
                attributes: true,
                attributeFilter: ["class"]
            });
        })();
    </script>

    <!-- Inicialização do código original -->
    <script type="module">
        import "./jb.js?v=19";
    </script>

</body>
</html>
